services:
  mongodb:
    image: mongo:7.0
    container_name: voice-chat-mongodb-prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: voice_chat
    volumes:
      - mongodb_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: voice-chat-backend-prod
    restart: unless-stopped
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-voice_chat}
      BACKEND_URL: ${BACKEND_URL}
      LLM_ENGINE: ${LLM_ENGINE}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      LLM_MODEL: ${LLM_MODEL}
      STT_MODEL_NAME: ${STT_MODEL_NAME:-csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8}
    extra_hosts:
      - "backend.localhost:127.0.0.1"
      - "mongodb.localhost:127.0.0.1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen(os.environ['BACKEND_URL'] + '/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: voice-chat-frontend-prod
    restart: unless-stopped
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: ${BACKEND_URL}
    extra_hosts:
      - "backend.localhost:127.0.0.1"
    volumes:
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro

volumes:
  mongodb_data_prod:
    name: voice_chat_mongodb_data_prod
