[project]
name = "voice-chat-backend"
version = "0.1.0"
description = "FastAPI backend for Voice Chat application with STT, TTS, RAG and MongoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.29.0",
    "motor>=3.7.0",
    "numpy>=2.2.0",
    "onnxruntime>=1.20.0",
    "openai>=1.65.0",
    "piper-tts>=1.2.0",
    "pydub>=0.25.1",
    "pymongo>=4.11.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "useful-moonshine-onnx>=20251121",
    "uvicorn>=0.34.0",
    "websockets>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
