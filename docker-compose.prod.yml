services:
  mongodb:
    image: mongo:7.0
    container_name: voice-chat-mongodb-prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: voice_chat
    volumes:
      - mongodb_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: voice-chat-backend-prod
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: voice_chat
      LLM_ENGINE: ${LLM_ENGINE:-lmstudio}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-3-4b-it-qat}
      STT_MODEL_NAME: ${STT_MODEL_NAME:-medium-streaming}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: voice-chat-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./key.pem:/etc/nginx/certs/key.pem:ro

volumes:
  mongodb_data_prod:
    name: voice_chat_mongodb_data_prod
