<div class="voice-controls">
  <button
    class="mic-button"
    [ngClass]="{
      recording: isRecording(),
      processing: isProcessing(),
      disabled: disabled() || isProcessing()
    }"
    [disabled]="disabled() || isProcessing()"
    (click)="onToggleMic.emit()"
    [title]="
      isProcessing()
        ? 'Processing voice...'
        : isRecording()
        ? 'Listening (VAD active - speak to interrupt or click to stop)'
        : 'Click to talk (VAD active)'
    "
  >
    <i
      class="pi"
      [ngClass]="
        isProcessing()
          ? 'pi-spin pi-spinner'
          : 'pi-microphone'
      "
    ></i>
  </button>

  @if (isRecording()) {
    <span class="recording-label">Listening...</span>
  }
  @if (isProcessing()) {
    <span class="recording-label">Processing voice...</span>
  }
</div>
